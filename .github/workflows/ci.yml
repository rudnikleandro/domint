name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install libcurl headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Check formatting
        if: runner.os == 'Linux'
        run: pipx install clang-format==18.1.8 && make format-check

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Fuzz the parsers and report writers (ASan + UBSan)
        run: make fuzz FUZZ_RUNS=5000

      - name: Smoke test
        run: ./domint --version && ./domint --help > /dev/null
